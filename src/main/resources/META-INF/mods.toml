# ── 关于 Blueprint（Team Abnormals 前置库）─────────────────────────────────────────────────
# 历史上 Better Badlands 1.16.5 强依赖 abnormals_core；该库在 1.18+ 更名为 Blueprint。
# 本次移植【没有】把它作为依赖引入：AbnormalsCore 提供的那几个类在本模组里都有等价实现——
#   AbnormalsCore ThatchBlock / ThatchSlabBlock / ThatchStairsBlock
#       → 本模组 com.teamaurora.bayou_blues.common.block.BBBlocks.Thatch*
#   AbnormalsCore ThatchVerticalSlabBlock（Blueprint 1.20.x 已删除该类）
#       → 本模组 com.teamaurora.bayou_blues.common.block.thatch.ThatchVerticalSlabBlock
#   AbnormalsCore TreeUtil（Blueprint 1.20.x 已删除该类）
#       → 本模组 com.teamaurora.bayou_blues.common.util.TreeUtil
# 因此本模组既不声明 blueprint 依赖，也不引用 blueprint 的任何一个类。
# 环境里同时装有 Blueprint 时：Blueprint 是独立 modId（blueprint）、独立命名空间、
# 独立 mixin 配置（blueprint.mixins.json，34 个 mixin，与本模组空 mixin 列表无交集），
# 两者互不干扰。已实测：同时加载 Blueprint 1.20.1-7.1.3 可正常进入世界。



